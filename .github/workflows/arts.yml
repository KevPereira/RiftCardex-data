name: Sauvegarde des illustrations

# L'app streame ses illustrations depuis le CDN Riot. Si ce CDN tombe, toutes les cartes
# deviennent grises pour tout le monde et rien ne permet de re-heberger.
#
# Riot change aussi des illustrations en silence : entre le 2026-06-12 et le 2026-07-24,
# 22 arts ont change de contenu. Une archive faite une fois se perime sans rien dire.
#
# Deux niveaux, pilotes par la variable de depot ARTS_BACKUP_ENABLED :
#   != 'true'  -> journal seul (arts/observed.json). Aucun octet telecharge, aucun secret
#                 requis. On sait deja QUAND Riot remplace un art.
#   == 'true'  -> telechargement de tout ce qui n'est pas encore sauvegarde + envoi vers
#                 Cloudflare R2. Le premier passage envoie l'archive complete (~1 Go).
#
# Le bucket R2 doit rester PRIVE : c'est de la conservation, pas de la diffusion. On ne
# l'ouvre au public que le jour ou le CDN de Riot tombe.

on:
  schedule:
    # Lundi 04:00 UTC -- decale du cron des prix (09:30) pour ne pas cumuler les runs.
    - cron: '0 4 * * 1'
    # SECONDE PASSE LE MEME JOUR. La source est erratique : le 2026-09-14 elle a rendu
    # 524, puis 200 en 38 s, puis 502, puis 200 en 1,5 s, en moins d'une heure. Retenter
    # A L'ECHELLE DE L'HEURE est la seule granularite qui vaille pour un cron
    # hebdomadaire -- les 6 s de back-off internes sont calibrees pour un 429.
    # AUCUNE condition n'est necessaire : le script est deja idempotent (il lit, compare,
    # et n'ecrit que sur difference), donc une seconde passe apres un succes coute ~40 s
    # de runner et ne produit aucun commit. En mode telechargement, elle ramasse en plus
    # ce que la premiere n'avait pas pu prendre.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  # Pour l'alerte ci-dessous. prices.yml l'avait, pas celui-ci : sur un cron
  # HEBDOMADAIRE, un echec non signale, c'est jusqu'a sept jours d'ignorance.
  issues: write

concurrency:
  group: arts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Le fetch de Node n a AUCUN delai par defaut : undici plafonne a 300 s par
    # requete, donc getJson peut tenir 25 min sur une seule URL et le pool de
    # telechargement bien davantage -- jusqu au plafond de 6 h de GitHub, pendant que
    # le run de la semaine suivante fait la queue (concurrency, cancel-in-progress:
    # false). C est la borne qui protege sans calibrer un seuil contre une latence qui
    # bouge. Les 8 runs verts tiennent en 17-50 s.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Journal et telechargement
        env:
          ARTS_BACKUP_ENABLED: ${{ vars.ARTS_BACKUP_ENABLED }}
        run: |
          if [ "$ARTS_BACKUP_ENABLED" = "true" ]; then
            node sync-arts.mjs
          else
            echo "ARTS_BACKUP_ENABLED != 'true' -> journal seul, aucun telechargement."
            node sync-arts.mjs --no-download
          fi

      - name: Envoi vers R2
        if: ${{ vars.ARTS_BACKUP_ENABLED == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] \
             || [ -z "${R2_ENDPOINT:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "Configuration R2 incomplete -> envoi saute (le journal, lui, est a jour)."
            exit 0
          fi
          if [ ! -d _arts ]; then
            echo "Rien de nouveau a envoyer."
            exit 0
          fi

          # Une illustration remplacee est d'abord recopiee sous un prefixe date : Riot ne
          # resservira jamais l'ancienne version. On distingue "l'objet n'existe pas encore"
          # (normal) d'une vraie panne R2 -- dans ce second cas on s'arrete AVANT d'ecraser.
          STAMP=$(date -u +%Y%m%d)
          if [ -s _arts/_remplacees.txt ]; then
            while IFS= read -r KEY || [ -n "$KEY" ]; do
              [ -z "$KEY" ] && continue
              if aws s3api head-object --bucket "$R2_BUCKET" --key "arts/$KEY" \
                   --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
                aws s3 cp "s3://$R2_BUCKET/arts/$KEY" "s3://$R2_BUCKET/remplacees/$STAMP/$KEY" \
                  --endpoint-url "$R2_ENDPOINT"
                echo "  ancienne version archivee : remplacees/$STAMP/$KEY"
              else
                echo "  pas d'ancienne version sur R2 pour $KEY (rien a archiver)"
              fi
            done < _arts/_remplacees.txt
          fi

          aws s3 cp _arts/ "s3://$R2_BUCKET/arts/" --recursive \
            --exclude "_remplacees.txt" --exclude "_echecs.txt" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Commit du journal et du manifeste
        run: |
          git config user.name "riftcardex-bot"
          git config user.email "kape.apps@gmail.com"
          # 'git add arts/' et pas la liste des deux fichiers : en mode journal seul
          # manifest.json n'existe pas, et un pathspec qui ne matche rien fait echouer
          # le step (le shell par defaut des runs est bash -e). arts/ ne contient que
          # du JSON, les octets d'illustration vont dans _arts/ qui est gitignore.
          git add arts/
          if git diff --cached --quiet; then
            echo "Rien n'a bouge chez Riot -> pas de commit."
          else
            git commit -m "arts: journal du $(date -u +%Y-%m-%d)"
            # Le cron des prix pousse aussi sur main (groupes de concurrency distincts).
            # Les deux jobs touchent des fichiers disjoints : le rebase passe tout seul,
            # et evite un run rouge pour un simple non-fast-forward.
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "push refuse (tentative $i) -- nouvelle tentative"
              sleep 10
            done
            echo "Impossible de pousser apres 3 tentatives."
            exit 1
          fi

      - name: Signaler les echecs
        if: always()
        run: |
          if [ -s _arts/_echecs.txt ]; then
            echo "Des illustrations n'ont pas pu etre sauvegardees (retentees au prochain passage) :"
            cat _arts/_echecs.txt
            exit 1
          fi

      # Calque du patron de prices.yml. Il manquait ici, et c'est le cron le PLUS
      # espace des deux : sans lui, trois echecs d'affilee ne laissent aucune trace
      # cumulee, et le seul signal est un mail hebdomadaire qu'on finit par ne plus
      # ouvrir. L'anti-doublon commente l'issue ouverte au lieu d'en creer une par
      # semaine -- une alerte qui se repete a l'identique cesse d'etre lue.
      - name: Signaler un echec de sauvegarde
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const corps = [
              'La sauvegarde hebdomadaire des illustrations a echoue.',
              '',
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              "Ce qui est en jeu : `arts/observed.json` est le JOURNAL DATE des changements",
              "chez Riot. Il n est reecrit QUE s il a bouge -- un journal fige est donc",
              "indistinguable d un journal a l arret, et le run vert est le seul temoin que",
              "ce cron est vivant. Une semaine manquee ne laisse aucune trace d elle-meme.",
              '',
              "Lire le log AVANT de toucher au code :",
              "- `PANNE AMONT` (code 2) = l API n a pas repondu. Rien a faire de notre cote :",
              "  la source est erratique (mesure le 2026-09-14 : 524, puis 200 en 38 s, puis",
              "  502, puis 200 en 1,5 s, en moins d une heure). La seconde passe de 13:00 UTC",
              "  existe pour ca. Si les DEUX echouent plusieurs semaines de suite, c est un",
              "  vrai sujet.",
              "- `REFUS : ...` = l API a repondu 200 mais INCOMPLET, et une garde a empeche",
              "  d ecrire un journal ampute. Ne jamais desarmer la garde pour faire passer le",
              "  run : ce qu on ecrirait serait une entree datee fausse, indistinguable d un",
              "  vrai ajout Riot au passage suivant.",
              "- une stack Node (code 1) = c est chez nous.",
            ].join('\n');
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sauvegarde-arts',
            });
            if (ouvertes.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ouvertes.data[0].number,
                body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Arts : la sauvegarde hebdomadaire echoue',
                body: corps,
                labels: ['sauvegarde-arts'],
              });
            }
