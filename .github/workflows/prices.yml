name: Prix quotidiens

on:
  schedule:
    # ~09:30 UTC : apres le refresh du price guide Cardmarket (00:43) et des produits TCGCSV (veille 20:00).
    - cron: '30 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 est INDISPENSABLE : build-history.mjs reconstruit history.json
      # en rejouant le git log de prices/prices.json. Avec le clone superficiel par
      # defaut, il ne voyait que 2 commits et REECRIVAIT l historique complet chaque
      # jour — le fichier repartait de zero toutes les 24 h.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      # Node 20+ est preinstalle sur ubuntu-latest ; le collecteur n'utilise que des modules natifs + fetch.
      # Kill-switch : l'affichage cote app reste coupe tant que la variable de depot PRICES_ENABLED != 'true'.
      # KP la bascule dans Settings > Secrets and variables > Actions > Variables, sans toucher au code.
      - name: Collecte
        id: collecte
        env:
          PRICES_ENABLED: ${{ vars.PRICES_ENABLED }}
        run: node collect-prices.mjs


      # Un ecart qui grossit veut presque toujours dire "un set est sorti et il n a pas de
      # prix". Le taux de resolution ne peut PAS le voir : son denominateur est la table gelee.
      - name: Signaler un ecart de couverture
        if: steps.collecte.outputs.ecart_alerte == '1'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const corps = process.env.ECART_CORPS;
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'couverture-prix',
            });
            if (ouvertes.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ouvertes.data[0].number,
                body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Prix : des cartes du catalogue ne sont pas cotees',
                body: corps,
                labels: ['couverture-prix'],
              });
            }
        env:
          ECART_CORPS: ${{ steps.collecte.outputs.ecart_corps }}
      - name: Commit si les prix ont bouge
        run: |
          git config user.name "riftcardex-bot"
          git config user.email "kape.apps@gmail.com"
          git add prices/prices.json prices/manifest.json
          if git diff --cached --quiet; then
            echo "Aucun changement de prix -> pas de commit (pas de faux point d'historique)."
          else
            git commit -m "prix: collecte du $(date -u +%Y-%m-%d)"
            node build-history.mjs
            git add prices/history.json
            git commit --amend --no-edit
            git push
          fi


      # Sans ca, un blocage Cardmarket gele les prix en silence : le manifeste garde son
      # generated_at, l app ne voit rien passer, et la date affichee vieillit sans alerte.
      - name: Signaler un echec de collecte
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const corps = [
              'La collecte quotidienne des prix a echoue.',
              '',
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              "Tant qu elle echoue, `prices/manifest.json` garde son `generated_at` :",
              "l app ne retelecharge rien et continue d afficher les derniers prix connus,",
              "sans jamais signaler qu ils vieillissent. Causes deja vues : blocage",
              "Cardmarket (403), un groupe TCGCSV en echec, resolution sous le seuil de 95%.",
            ].join('\n');
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'collecte-prix',
            });
            if (ouvertes.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ouvertes.data[0].number,
                body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Prix : la collecte quotidienne echoue',
                body: corps,
                labels: ['collecte-prix'],
              });
            }